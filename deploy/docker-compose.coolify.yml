# Coolify deployment (Docker Compose build pack). Coolify's own proxy (Traefik) terminates TLS, so
# there is no Caddy here: give each web service its domain(s) in Coolify:
#   admin       → https://admin.<root>:3000
#   api         → https://api.<root>:4000
#   storefront  → https://<root>:3000 plus one https://<store>.<root>:3000 per store host
# and set the variables below in Coolify's Environment Variables (secrets are generated by Coolify
# when left as SERVICE_PASSWORD_* / SERVICE_BASE64_*). See docs/deployment.md.
services:
  postgres:
    build: { context: .., dockerfile: deploy/postgres.Dockerfile }
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      SHOP_OWNER_PASSWORD: ${SERVICE_PASSWORD_SHOPOWNER}
      SHOP_APP_PASSWORD: ${SERVICE_PASSWORD_SHOPAPP}
      SHOP_PLATFORM_PASSWORD: ${SERVICE_PASSWORD_SHOPPLATFORM}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d shop']
      interval: 5s
      retries: 30

  migrate:
    build: { context: .., target: migrate }
    environment:
      DATABASE_URL_MIGRATE: postgresql://shop_owner:${SERVICE_PASSWORD_SHOPOWNER}@postgres:5432/shop
    depends_on: { postgres: { condition: service_healthy } }
    restart: 'no'
    exclude_from_hc: true

  api:
    build: { context: .., target: api }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_STAGE: ${APP_STAGE:-staging}
      RUN_JOBS: 'false'
      DATABASE_URL: postgresql://shop_app:${SERVICE_PASSWORD_SHOPAPP}@postgres:5432/shop
      DATABASE_URL_PLATFORM: postgresql://shop_platform:${SERVICE_PASSWORD_SHOPPLATFORM}@postgres:5432/shop
      PUBLIC_API_URL: https://api.${ROOT_DOMAIN}
      ADMIN_PUBLIC_URL: https://admin.${ROOT_DOMAIN}
      CORS_ORIGINS: https://admin.${ROOT_DOMAIN}
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
      STOREFRONT_ROOT_DOMAIN: ${ROOT_DOMAIN}
      STOREFRONT_PUBLIC_URL: https://{subdomain}.${ROOT_DOMAIN}
      STOREFRONT_PROTOCOL: https
      PLATFORM_CNAME_TARGET: stores.${ROOT_DOMAIN}
      STOREFRONT_SHARED_SECRET: ${SERVICE_BASE64_64_STOREFRONT}
      APP_ENCRYPTION_KEY: ${SERVICE_BASE64_64_ENCRYPTION}
      DNS_VERIFIER: dns
      REQUIRE_PLATFORM_2FA: ${REQUIRE_PLATFORM_2FA:-false}
      WEBHOOK_ALLOW_PRIVATE_URLS: 'false'
      STORAGE_DIR: /app/storage
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-mailbox}
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
      EMAIL_FROM: ${EMAIL_FROM:-Commerce Platform <no-reply@example.com>}
      PAYMENT_PROVIDERS: ${PAYMENT_PROVIDERS:-razorpay}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      BILLING_PROVIDER: razorpay
      BILLING_RAZORPAY_KEY_ID: ${BILLING_RAZORPAY_KEY_ID}
      BILLING_RAZORPAY_KEY_SECRET: ${BILLING_RAZORPAY_KEY_SECRET}
      BILLING_RAZORPAY_WEBHOOK_SECRET: ${BILLING_RAZORPAY_WEBHOOK_SECRET}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_MERCHANT_PASSWORD: ${SEED_MERCHANT_PASSWORD:-}
    volumes:
      - media:/app/storage
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker:
    build: { context: .., target: api }
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment:
      NODE_ENV: production
      APP_STAGE: ${APP_STAGE:-staging}
      RUN_JOBS: 'true'
      DATABASE_URL: postgresql://shop_app:${SERVICE_PASSWORD_SHOPAPP}@postgres:5432/shop
      DATABASE_URL_PLATFORM: postgresql://shop_platform:${SERVICE_PASSWORD_SHOPPLATFORM}@postgres:5432/shop
      PUBLIC_API_URL: https://api.${ROOT_DOMAIN}
      ADMIN_PUBLIC_URL: https://admin.${ROOT_DOMAIN}
      CORS_ORIGINS: https://admin.${ROOT_DOMAIN}
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
      STOREFRONT_ROOT_DOMAIN: ${ROOT_DOMAIN}
      STOREFRONT_PUBLIC_URL: https://{subdomain}.${ROOT_DOMAIN}
      STOREFRONT_PROTOCOL: https
      PLATFORM_CNAME_TARGET: stores.${ROOT_DOMAIN}
      STOREFRONT_SHARED_SECRET: ${SERVICE_BASE64_64_STOREFRONT}
      APP_ENCRYPTION_KEY: ${SERVICE_BASE64_64_ENCRYPTION}
      DNS_VERIFIER: dns
      REQUIRE_PLATFORM_2FA: ${REQUIRE_PLATFORM_2FA:-false}
      WEBHOOK_ALLOW_PRIVATE_URLS: 'false'
      STORAGE_DIR: /app/storage
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-mailbox}
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
      EMAIL_FROM: ${EMAIL_FROM:-Commerce Platform <no-reply@example.com>}
      PAYMENT_PROVIDERS: ${PAYMENT_PROVIDERS:-razorpay}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      BILLING_PROVIDER: razorpay
      BILLING_RAZORPAY_KEY_ID: ${BILLING_RAZORPAY_KEY_ID}
      BILLING_RAZORPAY_KEY_SECRET: ${BILLING_RAZORPAY_KEY_SECRET}
      BILLING_RAZORPAY_WEBHOOK_SECRET: ${BILLING_RAZORPAY_WEBHOOK_SECRET}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_MERCHANT_PASSWORD: ${SEED_MERCHANT_PASSWORD:-}
    volumes:
      - media:/app/storage
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s=require('fs').statSync(require('os').tmpdir()+'/worker-heartbeat');process.exit(Date.now()-s.mtimeMs<120000?0:1)"
      interval: 30s
      timeout: 3s
      start_period: 30s

  admin:
    build: { context: .., target: admin }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
      PUBLIC_API_URL: https://api.${ROOT_DOMAIN}
      STOREFRONT_ROOT_DOMAIN: ${ROOT_DOMAIN}
      STOREFRONT_PUBLIC_URL: https://{subdomain}.${ROOT_DOMAIN}
    depends_on: [api]

  storefront:
    build: { context: .., target: storefront }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
      PUBLIC_API_URL: https://api.${ROOT_DOMAIN}
      STOREFRONT_ROOT_DOMAIN: ${ROOT_DOMAIN}
      ADMIN_PUBLIC_URL: https://admin.${ROOT_DOMAIN}
      STOREFRONT_SHARED_SECRET: ${SERVICE_BASE64_64_STOREFRONT}
    depends_on: [api]

volumes:
  pgdata:
  media:
