name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      PGPASSWORD: postgres
      CI_DB_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && pnpm install --frozen-lockfile

      - name: Create roles and test database (same layout as scripts/dev-db.ps1)
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<SQL
          CREATE ROLE shop_owner LOGIN CREATEDB PASSWORD '$CI_DB_PASSWORD';
          CREATE ROLE shop_app LOGIN PASSWORD '$CI_DB_PASSWORD';
          CREATE ROLE shop_platform LOGIN BYPASSRLS PASSWORD '$CI_DB_PASSWORD';
          CREATE DATABASE shop_test OWNER shop_owner;
          SQL
          psql -h localhost -U postgres -d shop_test -v ON_ERROR_STOP=1 <<SQL
          ALTER SCHEMA public OWNER TO shop_owner;
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO shop_app, shop_platform;
          ALTER DEFAULT PRIVILEGES FOR ROLE shop_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO shop_app, shop_platform;
          ALTER DEFAULT PRIVILEGES FOR ROLE shop_owner IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO shop_app, shop_platform;
          SQL

      - name: Write local env files
        run: |
          base=localhost:5432
          {
            echo "TEST_DATABASE_URL=postgresql://shop_app:$CI_DB_PASSWORD@$base/shop_test"
            echo "TEST_DATABASE_URL_PLATFORM=postgresql://shop_platform:$CI_DB_PASSWORD@$base/shop_test"
            echo "TEST_DATABASE_URL_MIGRATE=postgresql://shop_owner:$CI_DB_PASSWORD@$base/shop_test"
            echo "DATABASE_URL=postgresql://shop_app:$CI_DB_PASSWORD@$base/shop_test"
            echo "DATABASE_URL_PLATFORM=postgresql://shop_platform:$CI_DB_PASSWORD@$base/shop_test"
            echo "DATABASE_URL_MIGRATE=postgresql://shop_owner:$CI_DB_PASSWORD@$base/shop_test"
            echo "STOREFRONT_SHARED_SECRET=ci-storefront-secret-0123456789abcdef"
            echo "APP_ENCRYPTION_KEY=ci-encryption-key-0123456789abcdef0123"
          } | tee apps/api/.env packages/db/.env > /dev/null

      - run: pnpm format:check
      - run: pnpm check
      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: End-to-end tests
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results

  images:
    # Builds every production image and boots the production compose topology with throwaway
    # secrets (migrations, API readiness, worker heartbeat, both Next.js apps).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and boot production images
        run: bash scripts/ci-compose-smoke.sh
